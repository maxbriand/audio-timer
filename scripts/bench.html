<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>storage bench</title>
<style>
  body{background:#0b0d10;color:#e6e6e6;font:15px/1.5 system-ui;margin:0;padding:16px}
  button{font:inherit;padding:12px 16px;margin:4px 0;width:100%;background:#1b2027;color:#e8b046;border:1px solid #333;border-radius:8px}
  pre{white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace;background:#111;padding:10px;border-radius:8px}
</style>
<h3>Audio Timer — storage bench</h3>
<button id="synth">A · synthetic 6 MB Blob</button>
<input type="file" id="file" accept="audio/*" style="display:block;margin:8px 0">
<button id="preflight">C · preflight (persist + wakeLock)</button>
<button id="reput">D · savePos re-put (read, bump position, put)</button>
<button id="clear">clear db</button>
<pre id="out"></pre>
<script>
'use strict';
const out = document.getElementById('out');
function log(s){ out.textContent += s + '\n'; console.log('[BENCH] ' + s); }

const DB_NAME = 'bench-db';
let _db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { const d = r.result; if(!d.objectStoreNames.contains('tracks')) d.createObjectStore('tracks',{keyPath:'id'}); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const db = () => _db || (_db = openDB());
const req = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
async function put(rec){
  const d = await db();
  const tx = d.transaction('tracks','readwrite');
  const p = req(tx.objectStore('tracks').put(rec));
  // Time the real durability point, not just the request callback: the request can succeed
  // long before the transaction actually commits to disk.
  const done = new Promise((res,rej)=>{ tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); });
  await p; await done;
}

const ms = t => Math.round(performance.now() - t) + ' ms';

function probeDuration(blob){
  return new Promise((res, rej) => {
    const a = new Audio(), u = URL.createObjectURL(blob);
    a.preload = 'metadata';
    a.onloadedmetadata = () => { const d = a.duration; URL.revokeObjectURL(u); res(isFinite(d)?d:0); };
    a.onerror = () => { URL.revokeObjectURL(u); rej(new Error('unreadable')); };
    a.src = u;
  });
}

async function bench(label, blob){
  log('--- ' + label + ' · ' + (blob.size/1e6).toFixed(2) + ' MB · ' + (blob.type||'no type') + ' ---');

  let t = performance.now();
  try { const d = await probeDuration(blob); log('probeDuration      ' + ms(t) + '  (' + Math.round(d) + 's)'); }
  catch(e){ log('probeDuration      ' + ms(t) + '  FAILED ' + e.message); }

  // How long it takes merely to pull the bytes into the JS heap. On a File backed by a
  // content:// URI this is the ContentResolver read; on an in-memory Blob it is ~free.
  t = performance.now();
  const buf = await blob.arrayBuffer();
  log('arrayBuffer()      ' + ms(t) + '  (' + buf.byteLength + ' bytes)');

  // The path the app uses today: hand the File/Blob straight to IndexedDB.
  t = performance.now();
  await put({id:'blob-'+Math.random(), blob});
  log('put(Blob)          ' + ms(t));

  // The alternative: store the bytes as an ArrayBuffer instead of a Blob reference.
  t = performance.now();
  await put({id:'buf-'+Math.random(), buf});
  log('put(ArrayBuffer)   ' + ms(t));

  // Re-wrapping the bytes as a fresh in-memory Blob before the write.
  t = performance.now();
  const fresh = new Blob([buf], {type: blob.type || 'audio/mpeg'});
  await put({id:'fresh-'+Math.random(), blob: fresh});
  log('put(fresh Blob)    ' + ms(t));

  // The proposed path: read the bytes once, then probe the in-memory copy instead of making
  // the media stack pull the source a second time.
  t = performance.now();
  try { const d = await probeDuration(fresh); log('probe(fresh Blob)  ' + ms(t) + '  (' + Math.round(d) + 's)'); }
  catch(e){ log('probe(fresh Blob)  ' + ms(t) + '  FAILED ' + e.message); }

  log('');
}

// The two optional pre-flight calls the import awaits before it does any work. Neither has a
// timeout in the app today, so if either hangs on a given device the whole import hangs with
// it — and the progress bar blames the write.
document.getElementById('preflight').onclick = async () => {
  log('--- preflight ---');
  let t = performance.now();
  try { const g = await navigator.storage.persist(); log('storage.persist()  ' + ms(t) + '  -> ' + g); }
  catch(e){ log('storage.persist()  ' + ms(t) + '  THREW ' + e.name + ' ' + e.message); }
  t = performance.now();
  if (!navigator.wakeLock) { log('wakeLock           absent (navigator.wakeLock undefined)'); }
  else {
    try { const l = await navigator.wakeLock.request('screen'); log('wakeLock.request   ' + ms(t) + '  ok'); l.release(); }
    catch(e){ log('wakeLock.request   ' + ms(t) + '  THREW ' + e.name + ' ' + e.message); }
  }
  log('');
};

document.getElementById('synth').onclick = async () => {
  const bytes = new Uint8Array(6 * 1024 * 1024);
  for (let i = 0; i < bytes.length; i++) bytes[i] = i & 255;
  await bench('A synthetic', new Blob([bytes], {type:'audio/mpeg'}));
};

document.getElementById('file').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) await bench('B picked file · ' + f.name, f);
};

// What savePos() does every 5 s of playback: take the in-memory track record — blob and all —
// change one number on it, and hand the whole thing back to IndexedDB.
document.getElementById('reput').onclick = async () => {
  log('--- D savePos re-put ---');
  const bytes = new Uint8Array(6 * 1024 * 1024);
  for (let i = 0; i < bytes.length; i++) bytes[i] = i & 255;
  const rec = {id:'track-1', blob: new Blob([bytes], {type:'audio/mpeg'}), position: 0};

  let t = performance.now();
  await put(rec);
  log('initial put        ' + ms(t));

  // The record the app keeps in memory and re-puts: same Blob object each time.
  for (let i = 1; i <= 5; i++){
    rec.position = i * 5;
    t = performance.now();
    await put(rec);
    log('re-put #' + i + ' (same Blob) ' + ms(t));
  }

  // And the variant where the record came back out of the store first, as load() does.
  const d = await db();
  const fromStore = await req(d.transaction('tracks','readonly').objectStore('tracks').get('track-1'));
  for (let i = 1; i <= 3; i++){
    fromStore.position = 100 + i;
    t = performance.now();
    await put(fromStore);
    log('re-put #' + i + ' (loaded)    ' + ms(t));
  }

  // What it costs if the position lives on its own, away from the blob.
  const tx = d.transaction('tracks','readwrite');
  await req(tx.objectStore('tracks').put({id:'pos-only', position: 1}));
  t = performance.now();
  await put({id:'pos-only', position: 2});
  log('put(position only) ' + ms(t));
  log('');
};

document.getElementById('clear').onclick = async () => {
  const d = await db(); const tx = d.transaction('tracks','readwrite');
  await req(tx.objectStore('tracks').clear()); log('cleared');
};

log('ready · UA ' + navigator.userAgent.slice(0, 90));
</script>
